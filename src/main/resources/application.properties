# =========================================
# CONFIGURACION DEL MICROSERVICIO
# =========================================

spring.application.name=veranum_coreusuario
server.port=8081


# =========================================
# CONFIGURACION MYSQL
# =========================================

spring.datasource.url=jdbc:mysql://localhost:3306/veranum_usuario?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================
# CONFIGURACION JPA / HIBERNATE
# =========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# INICIALIZACION DE DATOS
# =========================================

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always